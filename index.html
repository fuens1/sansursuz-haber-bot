<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANSÜRSÜZ HABER | Tarafsız ve Hızlı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Playfair+Display:wght@700&display=swap');
        
        :root {
            --bg-body: #f7f9fa; --bg-header: #ffffff; --bg-card: #ffffff;
            --text-main: #111111; --text-muted: #777777; --border-color: #eaeaea;
            --top-bar-bg: #111111; --top-bar-text: #ffffff; --nav-bg: #d32f2f;
            --hover-red: #b71c1c; --card-shadow: rgba(0,0,0,0.06);
            --input-bg: #ffffff; --input-border: #cccccc;
        }

        [data-theme="dark"] {
            --bg-body: #121212; --bg-header: #1e1e1e; --bg-card: #1e1e1e;
            --text-main: #e0e0e0; --text-muted: #aaaaaa; --border-color: #333333;
            --top-bar-bg: #000000; --top-bar-text: #e0e0e0; --nav-bg: #a61c1c;
            --hover-red: #7f1212; --card-shadow: rgba(0,0,0,0.5);
            --input-bg: #2a2a2a; --input-border: #444444;
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        
        .top-bar { background: var(--top-bar-bg); color: var(--top-bar-text); font-size: 12px; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1px; }
        
        header { background-color: var(--bg-header); padding: 25px 20px; text-align: center; border-bottom: 1px solid var(--border-color); position: relative; transition: 0.3s;}
        .logo { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 900; letter-spacing: -1px; margin: 0; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .logo-icon { background: #d32f2f; color: white; padding: 5px 12px; border-radius: 4px; font-size: 32px; font-family: 'Roboto', sans-serif;}
        .slogan { font-size: 14px; color: var(--text-muted); margin-top: 8px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; user-select: none; -webkit-user-select: none;}
        
        .theme-toggle { position: absolute; right: 30px; top: 35px; background: var(--bg-card); border: 2px solid var(--border-color); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; display:flex; align-items:center; gap:8px;}

        .navbar { background-color: var(--nav-bg); display: flex; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100;}
        .nav-item { font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; padding: 18px 25px; transition: 0.3s; text-transform: uppercase; position: relative;}
        .nav-item:hover, .nav-item.active { background-color: var(--hover-red); border-bottom: 4px solid #fff; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        .news-article { background: var(--bg-card); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 15px var(--card-shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column; cursor: pointer; transition: 0.2s;}
        .news-article:hover { transform: translateY(-5px); border-color:#d32f2f;}
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(211, 47, 47, 0.4); border-color: rgba(211, 47, 47, 0.5); }
            50% { box-shadow: 0 0 15px rgba(211, 47, 47, 0.9); border-color: rgba(211, 47, 47, 1); }
            100% { box-shadow: 0 0 5px rgba(211, 47, 47, 0.4); border-color: rgba(211, 47, 47, 0.5); }
        }
        .unread-glow { animation: pulseGlow 1.5s infinite; border: 2px solid #d32f2f !important; }

        .news-media-wrapper { width: 100%; height: 250px; background-color: #000; display: flex; justify-content: center; align-items: center; border-bottom: 4px solid #d32f2f; overflow:hidden; position: relative;}
        .news-media { width: 100%; height: 100%; object-fit: contain; }
        
        .news-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .news-meta { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;}
        .news-meta span { background: #d32f2f; padding: 4px 8px; border-radius: 3px; color: #fff;}
        .news-title { font-size: 19px; font-weight: 900; margin: 0 0 10px 0; color: var(--text-main); }
        .news-text { font-size: 15px; line-height: 1.6; margin: 0; flex-grow: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;}
        
        .interaction-bar { display: flex; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); align-items: center; }
        .interact-btn { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; color: var(--text-muted); cursor: pointer; transition: 0.2s; padding: 5px 10px; border-radius: 20px; background: var(--bg-body);}
        .interact-btn:hover { color: #d32f2f; background: #ffebee;}

        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px);}
        .modal-backdrop.show { display: flex; animation: fadeIn 0.3s; }
        .modal-content { background: var(--bg-card); width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; border-radius: 8px; padding: 0; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display:flex; flex-direction: column;}
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 35px; cursor: pointer; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; font-weight:bold; line-height: 1;}
        .modal-media-wrap { width: 100%; background: #000; min-height: 300px; max-height: 60vh; display: flex; justify-content: center; align-items: center; position: relative;}
        .modal-media-wrap img, .modal-media-wrap video { width: 100%; height: 100%; max-height: 50vh; object-fit: contain; }
        .modal-text-wrap { padding: 30px; font-size: 18px; line-height: 1.8; color: var(--text-main); }
        
        .comment-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .comment-item { background: var(--bg-body); padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 15px; position: relative; display: flex; flex-direction: column;}
        .comment-date { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold;}
        
        input[type="text"] { width:100%; padding: 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: 4px; font-size:16px; outline:none; box-sizing:border-box; font-family:inherit;}
        input:focus { border-color: #d32f2f; }
        
        button { padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; color:white; font-size:15px; display: flex; align-items: center; justify-content: center;}
        .btn-red { background: #d32f2f; } .btn-red:hover { background: #b71c1c; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 20px; font-weight: bold; }
        .load-more-btn { background: var(--bg-card); color: var(--text-main); border: 2px solid var(--border-color); padding: 15px 30px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 30px auto; display: block; font-size: 16px; transition: 0.3s; width:100%; max-width: 400px;}
        .load-more-btn:hover { border-color: #d32f2f; color: #d32f2f; }

        @media (max-width: 768px) {
            body { padding-bottom: 70px; }
            header { padding: 15px 10px; }
            .logo { font-size: 26px; }
            .logo-icon { font-size: 22px; padding: 3px 8px; }
            .theme-toggle { top: 12px; right: 12px; padding: 6px 12px; font-size: 12px; }
            .top-bar { flex-direction: column; text-align: center; gap: 8px; padding: 10px; }
            .navbar { position: fixed; bottom: 0; top: auto; width: 100%; overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; border-top: 2px solid rgba(0,0,0,0.1); box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
            .nav-item { flex: 0 0 auto; font-size: 13px; padding: 15px 18px; border-bottom: none !important; }
            .nav-item.active { border-top: 4px solid #fff; background-color: var(--hover-red); }
            .container { margin-top: 15px; padding: 0 15px; }
            .news-grid { grid-template-columns: 1fr; }
            .modal-content { width: 100%; height: 100%; max-height: 100vh; border-radius: 0; }
            .modal-media-wrap { min-height: 250px; }
            .modal-close { top: 10px; right: 15px; background: rgba(0,0,0,0.5); padding: 0 10px; border-radius: 50%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <span id="currentDate">Tarih Yükleniyor...</span>
        </div>
        <span>Türkiye'nin En Hızlı Haber Portalı</span>
    </div>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">🌗 Tema</button>
        <h1 class="logo"><span class="logo-icon">SH</span> SANSÜRSÜZ HABER</h1>
        <div class="slogan">Doğrular Asla Gizlenemez</div>
    </header>

    <div class="navbar">
        <div class="nav-item active">📰 Ana Sayfa</div>
    </div>

    <div class="container">
        <div id="approved" class="panel active">
            <div id="approvedList" class="news-grid"></div>
            <div id="approvedLoadMoreContainer"></div>
        </div>
    </div>

    <!-- HABER DETAY MODALI -->
    <div class="modal-backdrop" id="newsModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-close" onclick="closeModal(true)">&times;</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        function checkDevice() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            if(isMobile) document.body.classList.add('mobile-device');
            else document.body.classList.remove('mobile-device');
        }
        window.addEventListener('resize', checkDevice);
        checkDevice();

        const currentTheme = localStorage.getItem('theme') || 'light';
        if(currentTheme === 'dark') document.body.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', document.body.getAttribute('data-theme') || 'light');
        }

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('tr-TR', options);

        const sessionUid = Math.random().toString(36).substring(2);
        function sendPing() { fetch('/ping', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: sessionUid }) }); }
        setInterval(sendPing, 15000); sendPing();

        const evtSource = new EventSource("/stream");
        evtSource.addEventListener("refreshNews", function(e) {
            loadApproved(true); 
        });

        let allApprovedNews = []; 
        let approvedPage = 1;
        const ITEMS_PER_PAGE = 12;
        let readNewsArray = JSON.parse(localStorage.getItem('sh_read_news')) || [];

        window.onload = () => loadApproved(true); 

        function generateMediaHtml(mediaObj, wrapClass, itemClass) {
            if (!mediaObj) return '';
            if (mediaObj.type === 'video') return `<div class="${wrapClass}"><video controls preload="metadata" class="${itemClass}" playsinline><source src="${mediaObj.url}" type="video/mp4"></video></div>`;
            else if (mediaObj.type === 'iframe') return `<div class="${wrapClass}" style="background:#000; width:100%; display:flex; justify-content:center; overflow:hidden;"><iframe src="${mediaObj.url}" frameborder="0" scrolling="yes" style="width:100%; height:100%; min-height:350px;"></iframe></div>`;
            else if (mediaObj.type === 'image') return `<div class="${wrapClass}"><img src="${mediaObj.url}" class="${itemClass}"></div>`;
            return '';
        }

        async function loadApproved(force = false) {
            const limit = approvedPage * ITEMS_PER_PAGE;
            const res = await fetch(`/admin/approved?limit=${limit}`);
            const data = await res.json();
            allApprovedNews = data.data; 
            
            const list = document.getElementById('approvedList');
            const loadMoreContainer = document.getElementById('approvedLoadMoreContainer');
            
            if(data.data.length === 0) {
                list.innerHTML = "<div class='empty-state' style='grid-column: 1 / -1;'>Şu an yayında haber bulunmuyor.</div>";
                loadMoreContainer.innerHTML = "";
                return;
            }

            list.innerHTML = data.data.map(msg => {
                const mediaHtml = generateMediaHtml(msg.media, "news-media-wrapper", "news-media");
                const isRead = readNewsArray.includes(msg.id);
                const glowClass = isRead ? '' : 'unread-glow';

                return `
                <article id="article-${msg.id}" class="news-article ${glowClass}" onclick="openModal('${msg.id}')">
                    ${mediaHtml}
                    <div class="news-content">
                        <div class="news-meta">
                            <span>${msg.channelName}</span>
                            <span style="background:transparent; color:var(--text-muted);">${msg.date}</span>
                        </div>
                        ${msg.title ? `<h3 class="news-title">${msg.title}</h3>` : ''}
                        <p class="news-text">${msg.text}</p>
                        <div class="interaction-bar">
                            <div class="interact-btn">💬 ${(msg.comments || []).length} Yorum</div>
                        </div>
                    </div>
                </article>
                `;
            }).join('');

            if(data.total > limit) {
                loadMoreContainer.innerHTML = `<button class="load-more-btn" onclick="loadMoreApproved()">⬇️ Daha Fazla Haber Yükle (${data.data.length} / ${data.total})</button>`;
            } else {
                loadMoreContainer.innerHTML = "";
            }
        }
        function loadMoreApproved() { approvedPage++; loadApproved(true); }

        function openModal(id) {
            const msg = allApprovedNews.find(m => m.id === id);
            if(!msg) return;

            if (!readNewsArray.includes(id)) {
                readNewsArray.push(id);
                localStorage.setItem('sh_read_news', JSON.stringify(readNewsArray));
                const card = document.getElementById(`article-${id}`);
                if (card) card.classList.remove('unread-glow');
            }

            interact(id, 'view'); 

            const modalBody = document.getElementById('modalBody');
            const mediaHtml = generateMediaHtml(msg.media, "modal-media-wrap", "");
            
            const commentsHtml = (msg.comments || []).map(c => `
                <div class="comment-item">
                    <div class="comment-date">👤 Ziyaretçi - ${c.date}</div>
                    <div>${c.text}</div>
                </div>`).join('');
            
            modalBody.innerHTML = `
                ${mediaHtml}
                <div class="modal-text-wrap">
                    ${msg.title ? `<h2 style="margin-top:0; color:#d32f2f;">${msg.title}</h2>` : ''}
                    <p style="white-space: pre-wrap;">${msg.text}</p>
                    <div class="comment-section">
                        <h3 style="margin-top:0;">Yorumlar (${(msg.comments || []).length})</h3>
                        <div style="display:flex; gap:10px; margin-bottom:20px;">
                            <input type="text" id="comment-input-${msg.id}" placeholder="Fikrini belirt..." style="flex:1;">
                            <button class="btn-red" onclick="submitComment('${msg.id}')">Gönder</button>
                        </div>
                        <div id="comment-list-${msg.id}">${commentsHtml || "<div style='color:var(--text-muted);'>İlk yorumu sen yap!</div>"}</div>
                    </div>
                </div>
            `;
            document.getElementById('newsModal').classList.add('show');
        }

        function closeModal(force = false) {
            if(force || event.target.id === 'newsModal') {
                document.getElementById('newsModal').classList.remove('show');
                loadApproved(true); 
            }
        }

        async function interact(id, action, data = null) {
            await fetch('/interact', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id, action, data }) });
        }

        async function submitComment(id) {
            const input = document.getElementById(`comment-input-${id}`);
            const text = input.value.trim();
            if(!text) return;
            await interact(id, 'comment', text);
            input.value = "";
            alert("Yorumunuz başarıyla gönderildi.");
            setTimeout(() => openModal(id), 300); 
        }
    </script>
</body>
</html>
